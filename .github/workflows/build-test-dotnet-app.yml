name: "Test .NET application"

on:
  workflow_call:
    inputs:
      project_path:
        required: true
        type: string
      dotnet_version:
        required: false
        type: string
        default: "8.0.x"
      test_runner:
        required: false
        type: string
        default: "VSTest"
        description: "Test runner to use: 'VSTest' or 'MTP'"

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

      - name: Install dependencies
        run: dotnet restore ${{ inputs.project_path }}

      - name: Build
        run: dotnet build -c Release

      - name: Test (VSTest)
        if: ${{ inputs.test_runner == 'VSTest' }}
        run: |
          dotnet test --configuration Release --results-directory "TestResults" --collect:"XPlat Code Coverage" \
            --no-build --no-restore

      - name: Test (MTP)
        if: ${{ inputs.test_runner == 'MTP' && inputs.dotnet_version == '10.0.x' }}
        run: | # exit-code 8 means zero tests
          dotnet test --configuration Release --results-directory "TestResults" --no-build --no-restore \
            --coverlet --coverlet-output-format cobertura --ignore-exit-code 8

      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/*cobertura*.xml" -targetdir:"coveragereport" -reporttypes:Html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coveragereport/
          retention-days: 5

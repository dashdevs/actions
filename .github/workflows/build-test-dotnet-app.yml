name: "Test .NET application"

on:
  workflow_call:
    inputs:
      project_path:
        required: true
        type: string
      dotnet_version:
        required: false
        type: string
        default: "8.0.x"
      test_runner:
        required: false
        type: string
        default: "VSTest"
        description: "Test runner to use: 'VSTest' or 'MTP'"

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        env:
          TEST_RUNNER: ${{ inputs.test_runner }}
          DOTNET_VERSION: ${{ inputs.dotnet_version }}
        run: |
          case "$TEST_RUNNER" in
            VSTest)
              case "$DOTNET_VERSION" in
                8.0.x|10.0.x) ;;
                *)
                  echo "::error title=Unsupported dotnet_version::test_runner is 'VSTest' but dotnet_version '$DOTNET_VERSION' is not in the supported list." \
                    "Only '8.0.x' and '10.0.x' are permitted."
                  exit 1
                  ;;
              esac
              ;;
            MTP)
              if [[ "$DOTNET_VERSION" != "10.0.x" ]]; then
                echo "::error title=MTP requires dotnet 10::test_runner is 'MTP' but dotnet_version is '$DOTNET_VERSION'." \
                  "MTP-based dotnet test requires dotnet_version '10.0.x'."
                exit 1
              fi
              ;;
            *)
              echo "::error title=Unknown test_runner::'$TEST_RUNNER' is not a recognized test_runner value." \
                "Must be 'VSTest' or 'MTP'."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

      - name: Install dependencies
        run: dotnet restore ${{ inputs.project_path }}

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: | # exit-code 8 means zero tests (MTP only)
          dotnet test --configuration Release --results-directory "TestResults" --no-build --no-restore \
            ${{ inputs.test_runner == 'MTP'
              && '--coverlet --coverlet-output-format cobertura --ignore-exit-code 8'
              || '--collect:"XPlat Code Coverage"' }}

      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/*cobertura*.xml" -targetdir:"coveragereport" -reporttypes:Html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coveragereport/
          retention-days: 5

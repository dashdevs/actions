name: Configure semantic version

description: >-
  Derives a semantic version (X.Y.Z) from the current ref following the Gitflow
  branching model: from a tag or release/hotfix branch the version is read from
  the ref name; from develop the latest tag's minor is bumped; from master the
  latest released tag is used.

outputs:
  version:
    description: Semantic version string (X.Y.Z)
    value: ${{ steps.calculate-version.outputs.version }}

runs:
  using: composite
  steps:
    - id: calculate-version
      shell: bash
      run: |
        set -euo pipefail

        # Extract a clean MAJOR.MINOR.PATCH out of an arbitrary version-ish
        # string. Tolerates an optional leading 'v' and trailing text, so both
        # '1.2.3' and 'v1.2.3-some-text' normalise to '1.2.3'.
        normalize_version() {
          echo "$1" | sed -E 's/^v//; s/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/'
        }

        ref_type="${{ github.ref_type }}"
        ref_name="${{ github.ref_name }}"

        # 1. Built from a tag -> read the version directly from the tag name.
        if [[ "$ref_type" == "tag" ]]; then
          version=$(normalize_version "$ref_name")

        # 2. Built from a release/* or hotfix/* branch -> version from the
        #    branch name (e.g. 'release/1.2.3', 'hotfix/v1.1.1-some-text').
        elif [[ "$ref_name" =~ ^(release|hotfix)/ ]]; then
          version=$(normalize_version "${ref_name#*/}")

        # 3. Built from master -> the latest released version; HEAD must
        #    equal the latest tag (every release is tagged), else fail.
        elif [[ "$ref_name" == "master" || "$ref_name" == "main" ]]; then
          latest_tag=$(git tag --sort=-version:refname | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            echo "::error title=No tags found::No release tags exist in this repository."
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "$latest_tag")" != "$GITHUB_SHA" ]]; then
            echo "::error title=Untagged $ref_name::HEAD is not at the latest tag '$latest_tag'." \
              "Tag the release commit before building from $ref_name."
            exit 1
          fi
          version=$(normalize_version "$latest_tag")

        # 4. Built from develop or any other branch -> bump latest tag's minor.
        else
          latest_tag=$(git tag --sort=-version:refname | head -n 1)
          IFS='.' read -r major minor patch <<< "$(normalize_version "${latest_tag:-0.0.0}")"
          version="${major:-0}.$((minor + 1)).0"
        fi

        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error title=Invalid version::Could not derive a valid X.Y.Z version from ref '$ref_name' (got '$version')."
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"
